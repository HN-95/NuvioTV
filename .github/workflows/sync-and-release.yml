name: Sync Upstream & Auto Release

on:
  schedule:
    # Check upstream every 3 hours
    - cron: '0 */3 * * *'
  workflow_dispatch:
    inputs:
      force_release:
        description: Force build and publish a GitHub Release for the current version even if already synced
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: sync-and-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sync-and-release:
    name: Sync Upstream & Build Release APKs
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GH_PAT || github.token }}
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      LOCAL_PROPERTIES_BASE64: ${{ secrets.LOCAL_PROPERTIES_BASE64 }}
      LOCAL_DEV_PROPERTIES_BASE64: ${{ secrets.LOCAL_DEV_PROPERTIES_BASE64 }}
      RELEASE_KEYSTORE_BASE64: ${{ secrets.NUVIO_RELEASE_KEYSTORE_BASE64 }}
      RELEASE_KEY_ALIAS: ${{ secrets.NUVIO_RELEASE_KEY_ALIAS }}
      RELEASE_KEY_PASSWORD: ${{ secrets.NUVIO_RELEASE_KEY_PASSWORD }}
      RELEASE_STORE_PASSWORD: ${{ secrets.NUVIO_RELEASE_STORE_PASSWORD }}

    steps:
      - name: Check out fork repository
        uses: actions/checkout@v5
        with:
          ref: dev
          token: ${{ secrets.GH_PAT || github.token }}
          fetch-depth: 0
          submodules: false

      - name: Sync with NuvioMedia/NuvioTV upstream
        id: sync
        run: |
          git config user.name "HN-95 Auto-Sync"
          git config user.email "hassone111223@gmail.com"

          if ! git remote get-url upstream >/dev/null 2>&1; then
            git remote add upstream https://github.com/NuvioMedia/NuvioTV.git
          fi
          git fetch --no-tags upstream dev

          BEFORE_SHA="$(git rev-parse HEAD)"
          if ! git merge-base --is-ancestor upstream/dev HEAD; then
            echo "Merging new commits from upstream/dev..."
            git merge -X ours upstream/dev --no-edit

            # Take upstream's latest app/build.gradle.kts so new dependencies, tasks, and version bumps are always included,
            # then re-apply our fork's GITHUB_OWNER and v7a/v8a ABI split settings:
            git checkout upstream/dev -- app/build.gradle.kts
            sed -i 's/buildConfigField("String", "GITHUB_OWNER", "\\"NuvioMedia\\"")/buildConfigField("String", "GITHUB_OWNER", "\\"HN-95\\"")/g' app/build.gradle.kts
            sed -i 's/include("armeabi-v7a", "arm64-v8a", "x86", "x86_64")/include("armeabi-v7a", "arm64-v8a")/g' app/build.gradle.kts
            sed -i 's/isUniversalApk = true/isUniversalApk = false/g' app/build.gradle.kts

            # Keep our sync-and-release.yml intact
            git checkout "${BEFORE_SHA}" -- .github/workflows/sync-and-release.yml
            git add app/build.gradle.kts .github/workflows/sync-and-release.yml
            if ! git diff --cached --quiet; then
              git commit --amend --no-edit
            fi

            # Push merged commits; if token lacks workflow scope and upstream modified .github/workflows, fallback to keeping our workflows
            if ! git push origin HEAD:dev; then
              echo "Push with upstream workflow changes failed; restoring fork .github/workflows and retrying..."
              git checkout "${BEFORE_SHA}" -- .github/workflows
              git add .github/workflows
              git commit --amend --no-edit
              git push origin HEAD:dev
            fi
          else
            echo "Already up to date with upstream/dev."
          fi

          CURRENT_VERSION="$(sed -nE 's/^[[:space:]]*versionName[[:space:]]*=[[:space:]]*"([^"]+)".*$/\1/p' app/build.gradle.kts | head -n 1)"
          CURRENT_VERSION_CODE="$(sed -nE 's/^[[:space:]]*versionCode[[:space:]]*=[[:space:]]*([0-9]+).*$/\1/p' app/build.gradle.kts | head -n 1)"
          echo "version=${CURRENT_VERSION}" >> "${GITHUB_OUTPUT}"
          echo "version_code=${CURRENT_VERSION_CODE}" >> "${GITHUB_OUTPUT}"

          PRERELEASE="false"
          if [[ "${CURRENT_VERSION}" == *-* ]]; then
            PRERELEASE="true"
          fi
          echo "prerelease=${PRERELEASE}" >> "${GITHUB_OUTPUT}"

          FORCE_RELEASE="${{ inputs.force_release }}"
          if [[ "${FORCE_RELEASE}" == "true" ]]; then
            echo "should_release=true" >> "${GITHUB_OUTPUT}"
          elif gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${CURRENT_VERSION}" >/dev/null 2>&1; then
            echo "Release ${CURRENT_VERSION} already exists on ${GITHUB_REPOSITORY}."
            echo "should_release=false" >> "${GITHUB_OUTPUT}"
          else
            echo "New version ${CURRENT_VERSION} detected without a release on ${GITHUB_REPOSITORY}. Building release..."
            echo "should_release=true" >> "${GITHUB_OUTPUT}"
          fi

      - name: Set up Java 17
        if: steps.sync.outputs.should_release == 'true'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        if: steps.sync.outputs.should_release == 'true'
        uses: gradle/actions/setup-gradle@v4

      - name: Configure release properties and keystore
        if: steps.sync.outputs.should_release == 'true'
        run: |
          keystore_path="${RUNNER_TEMP}/nuviotv-release.jks"
          printf '%s' "${RELEASE_KEYSTORE_BASE64}" | base64 --decode > "${keystore_path}"
          printf '%s' "${LOCAL_PROPERTIES_BASE64}" | base64 --decode > local.properties

          if [[ -n "${LOCAL_DEV_PROPERTIES_BASE64}" ]]; then
            printf '%s' "${LOCAL_DEV_PROPERTIES_BASE64}" | base64 --decode > local.dev.properties
          fi

          set_property() {
            local property_name="$1"
            local property_value="$2"
            [[ -n "${property_value}" ]] || return 0
            sed -i -E "/^[[:space:]]*${property_name}[[:space:]]*=/d" local.properties
            printf '\n%s=%s\n' "${property_name}" "${property_value}" >> local.properties
          }

          sed -i -E '/^[[:space:]]*(sdk\.dir|NUVIO_RELEASE_STORE_FILE)[[:space:]]*=/d' local.properties
          set_property NUVIO_RELEASE_STORE_FILE "${keystore_path}"
          set_property NUVIO_RELEASE_KEY_ALIAS "${RELEASE_KEY_ALIAS}"
          set_property NUVIO_RELEASE_KEY_PASSWORD "${RELEASE_KEY_PASSWORD}"
          set_property NUVIO_RELEASE_STORE_PASSWORD "${RELEASE_STORE_PASSWORD}"
          chmod +x gradlew

      - name: Fetch Usenet Android sidecars if present
        if: steps.sync.outputs.should_release == 'true'
        run: |
          if [[ -f native/usenet/scripts/fetch_prebuilts.py ]]; then
            python3 native/usenet/scripts/fetch_prebuilts.py
            python3 native/usenet/scripts/check_prebuilts.py
          fi

      - name: Build Full Release APKs (v7a and v8a)
        if: steps.sync.outputs.should_release == 'true'
        run: ./gradlew :app:assembleFullRelease --stacktrace

      - name: Publish GitHub Release
        if: steps.sync.outputs.should_release == 'true'
        env:
          RELEASE_TAG: ${{ steps.sync.outputs.version }}
          RELEASE_PRERELEASE: ${{ steps.sync.outputs.prerelease }}
        run: |
          mapfile -t release_apks < <(find app/build/outputs/apk/full/release -maxdepth 1 -type f -name '*.apk' -print | sort)
          if (( ${#release_apks[@]} == 0 )); then
            echo "No release APKs were produced." >&2
            exit 1
          fi

          cat > release-notes.md <<EOF
          ## NuvioTV ${RELEASE_TAG} (with Hide Unwatched Episode Description)

          - Synced with official \`NuvioMedia/NuvioTV\` \`${RELEASE_TAG}\`
          - Includes **Hide Unwatched Episode Description** toggle across Detail, Player, and Modern Home views (\`Description was hidden to prevent spoilers\`)
          EOF

          # Ensure the tag on origin points to the latest merged HEAD of this fork
          git tag -f "${RELEASE_TAG}" HEAD
          git push origin "refs/tags/${RELEASE_TAG}" --force

          if gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release upload "${RELEASE_TAG}" "${release_apks[@]}" --repo "${GITHUB_REPOSITORY}" --clobber
          else
            release_args=(
              "${RELEASE_TAG}"
              --repo "${GITHUB_REPOSITORY}"
              --target "$(git rev-parse HEAD)"
              --title "NuvioTV ${RELEASE_TAG}"
              --notes-file release-notes.md
            )
            if [[ "${RELEASE_PRERELEASE}" == "true" ]]; then
              release_args+=(--prerelease)
            else
              release_args+=(--latest)
            fi
            gh release create "${release_args[@]}" "${release_apks[@]}"
          fi

      - name: Clean unmapped submodule index entry before post-checkout cleanup
        if: always()
        run: git rm --cached -f --ignore-unmatch libmpv-android >/dev/null 2>&1 || true
